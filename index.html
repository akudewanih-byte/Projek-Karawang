<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Cost Manager V3.3</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f6f8;color:#1f2937}
header{background:#111827;color:#fff;padding:16px}
header h1{margin:0;font-size:21px}
header p{margin:5px 0 0;color:#cbd5e1;font-size:13px}
.container{max-width:1200px;margin:auto;padding:15px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:15px;box-shadow:0 2px 10px rgba(0,0,0,.07)}
h2,h3{margin-top:0}
button{border:0;border-radius:8px;padding:9px 12px;cursor:pointer;font-weight:600}
.btn-primary{background:#2563eb;color:#fff}.btn-success{background:#16a34a;color:#fff}
.btn-warning{background:#d97706;color:#fff}.btn-danger{background:#dc2626;color:#fff}
.btn-secondary{background:#e5e7eb;color:#111827}.btn-dark{background:#111827;color:#fff}
button:disabled{opacity:.5;cursor:not-allowed}
input,select{width:100%;padding:9px;border:1px solid #d1d5db;border-radius:8px;background:#fff}
label{font-size:12px;font-weight:700;display:block;margin-bottom:5px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:#fff;border-radius:12px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.stat small{color:#6b7280}.stat strong{display:block;font-size:20px;margin-top:5px}
.project-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.project-card{border:1px solid #e5e7eb;border-radius:12px;padding:14px}
.project-card h3{margin:0 0 7px}
.meta{font-size:12px;color:#6b7280;margin:4px 0}
.badge{display:inline-block;padding:4px 8px;border-radius:20px;font-size:11px;font-weight:bold}
.draft{background:#fef3c7;color:#92400e}.running{background:#dbeafe;color:#1d4ed8}.done{background:#dcfce7;color:#166534}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar input{max-width:380px}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:850px}
th,td{border-bottom:1px solid #e5e7eb;padding:8px;text-align:left;font-size:13px}
th{background:#f9fafb}
td input,td select{min-width:100px;padding:7px}
.row-actions{display:flex;gap:5px;white-space:nowrap}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px}
.project-head{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;align-items:end}
.photo-box{display:flex;gap:10px;align-items:center}
.photo-preview{width:70px;height:55px;border-radius:8px;object-fit:cover;background:#e5e7eb;display:none}
.empty{text-align:center;color:#6b7280;padding:25px}
.hidden{display:none!important}
@media(max-width:800px){
 .grid,.stats,.project-grid,.project-head{grid-template-columns:1fr 1fr}
}
@media(max-width:520px){
 .container{padding:10px}.grid,.stats,.project-grid,.project-head{grid-template-columns:1fr}
 header h1{font-size:18px}
 .toolbar>*{width:100%;max-width:none!important}
}
#printReport{display:none}
@media print{
  @page{size:A4;margin:12mm 14mm}
  body{background:#fff;font-family:Arial,Helvetica,sans-serif;color:#111}
  body > header,.container{display:none!important}
  #printReport{display:block!important}
  .pr-header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #111;padding-bottom:10px;margin-bottom:12px}
  .pr-brand{font-size:18px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
  .pr-sub{font-size:10px;color:#555;margin-top:3px}
  .pr-report-no{text-align:right;font-size:10px;color:#444}
  .pr-title{text-align:center;font-size:18px;font-weight:700;margin:12px 0 3px}
  .pr-filter{text-align:center;font-size:9px;color:#555;margin-bottom:13px}
  .pr-info{display:grid;grid-template-columns:1fr 1fr;column-gap:28px;border-top:1px solid #bbb;border-bottom:1px solid #bbb;padding:7px 0;margin-bottom:14px}
  .pr-info-row{display:flex;font-size:10px;padding:2px 0}
  .pr-info-label{width:82px;color:#666}
  .pr-info-value{font-weight:600;flex:1}
  .pr-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:8px 0 18px;border-bottom:1px solid #999}
  .pr-summary-box{padding:7px 8px;border-top:1px solid #999}
  .pr-summary-box:not(:last-child){border-right:1px solid #ddd}
  .pr-summary-label{font-size:8px;color:#666;text-transform:uppercase}
  .pr-summary-value{font-size:11px;font-weight:700;margin-top:3px}
  .pr-section{margin-top:14px}
  .pr-section-title{font-size:11px;font-weight:700;text-transform:uppercase;border-bottom:1px solid #333;padding-bottom:4px;margin-bottom:4px}
  .pr-line{display:grid;grid-template-columns:70px 1fr 55px 70px 95px;gap:5px;font-size:9px;padding:3px 0;border-bottom:1px dotted #ccc}
  .pr-line-head{font-weight:700;border-bottom:1px solid #888!important;border-bottom-style:solid!important}
  .pr-right{text-align:right}
  .pr-subtotal{display:flex;justify-content:flex-end;font-size:10px;font-weight:700;padding-top:5px}
  .pr-grand{display:flex;justify-content:space-between;border-top:2px solid #111;border-bottom:2px solid #111;padding:8px 0;margin-top:18px;font-size:14px;font-weight:700}
  .pr-note{font-size:8px;color:#666;margin-top:8px}
  .pr-sign{display:grid;grid-template-columns:1fr 1fr;gap:70px;margin-top:38px}
  .pr-sign-box{text-align:center;font-size:9px}
  .pr-sign-space{height:48px}
  .pr-photo{max-width:75px;max-height:55px;object-fit:cover;margin-top:4px}
  .pr-footer{margin-top:18px;padding-top:6px;border-top:1px solid #bbb;font-size:8px;color:#666;text-align:center}
}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff;font-family:Arial,Helvetica,sans-serif;color:#111}
  body > header,.container{display:none!important}
  #printReport{display:block!important}
  .print-title{font-size:20px;font-weight:700;margin-bottom:4px}
  .print-meta{font-size:11px;color:#444;margin-bottom:18px}
  .print-section{margin-top:18px}
  .print-section h3{font-size:14px;margin:0 0 8px;border-bottom:1px solid #111;padding-bottom:5px}
  .print-line{display:flex;justify-content:space-between;gap:20px;padding:4px 0;font-size:11px}
  .print-line .desc{flex:1}
  .print-line .amount{width:120px;text-align:right}
  .print-subtotal{display:flex;justify-content:flex-end;border-top:1px solid #777;padding-top:5px;margin-top:4px;font-weight:700;font-size:11px}
  .print-grand{margin-top:22px;padding-top:8px;border-top:2px solid #111;font-size:15px;font-weight:700;display:flex;justify-content:space-between}
}
</style>
</head>
<body>
<header>
  <div class="container">
    <h1>Project Cost Manager V3.3</h1>
    <p>Kelola Material, Upah, BOP dan HPP proyek dalam satu dashboard.</p>
  </div>
</header>

<div id="printReport"></div>

<div class="container">
  <div id="dashboard">
    <div class="stats">
      <div class="stat"><small>Total Proyek</small><strong id="statProjects">0</strong></div>
      <div class="stat"><small>Proyek Berjalan</small><strong id="statRunning">0</strong></div>
      <div class="stat"><small>Proyek Selesai</small><strong id="statDone">0</strong></div>
      <div class="stat"><small>Total HPP Semua Proyek</small><strong id="statHpp">Rp 0</strong></div>
    </div>

    <div class="card" style="margin-top:15px">
      <div class="section-title">
        <h2>Daftar Proyek</h2>
        <button class="btn-primary" onclick="addProject()">+ Tambah Proyek</button>
      </div>
      <div class="toolbar" style="margin:10px 0">
        <input id="projectSearch" placeholder="Cari nama proyek..." oninput="renderDashboard()">
        <select id="projectStatusFilter" onchange="renderDashboard()">
          <option value="">Semua Status</option>
          <option>Draft</option>
          <option>Berjalan</option>
          <option>Selesai</option>
        </select>
      </div>
      <div id="projectList" class="project-grid"></div>
    </div>
  </div>

  <div id="detail" class="hidden">
    <div class="toolbar no-print" style="margin-bottom:12px">
      <button class="btn-secondary" onclick="backDashboard()">← Dashboard</button>
      <button class="btn-success" onclick="saveProjectMeta()">💾 Simpan Proyek</button>
      <button class="btn-danger" onclick="deleteCurrentProject()">Hapus Proyek</button>
      <button class="btn-dark" onclick="printProject()">Cetak / PDF</button>
      <button class="btn-primary" onclick="exportProjectCSV()">Export Excel (CSV)</button>
    </div>

    <div class="card">
      <h2>Data Proyek & Laporan</h2>
      <div class="project-head">
        <div><label>Nama Proyek</label><input id="pName" placeholder="Contoh: Proyek Gudang A"></div>
        <div><label>Tanggal</label><input id="pDate" type="date"></div>
        <div><label>Status</label><select id="pStatus"><option>Draft</option><option>Berjalan</option><option>Selesai</option></select></div>
        <div>
          <label>Foto Proyek</label>
          <div class="photo-box"><img id="projectPhotoPreview" class="photo-preview"><input id="pPhoto" type="file" accept="image/*" onchange="previewProjectPhoto(event)"></div>
        </div>
      </div>
      <div class="grid" style="margin-top:12px">
        <div><label>Nama Perusahaan</label><input id="pCompany" placeholder="Nama usaha/perusahaan"></div>
        <div><label>No. Laporan / No. Proyek</label><input id="pReportNo" placeholder="Contoh: PCM-001"></div>
        <div><label>Klien</label><input id="pClient" placeholder="Nama klien"></div>
        <div><label>Lokasi Proyek</label><input id="pLocation" placeholder="Lokasi proyek"></div>
        <div><label>Dibuat Oleh</label><input id="pPreparedBy" placeholder="Nama penyusun"></div>
        <div><label>Disetujui Oleh</label><input id="pApprovedBy" placeholder="Nama penanggung jawab"></div>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><small>Material</small><strong id="sumMaterial">Rp 0</strong></div>
      <div class="stat"><small>Upah</small><strong id="sumUpah">Rp 0</strong></div>
      <div class="stat"><small>BOP</small><strong id="sumBop">Rp 0</strong></div>
      <div class="stat"><small>Total HPP</small><strong id="sumHpp">Rp 0</strong></div>
    </div>

    <div class="card" style="margin-top:15px">
      <div class="section-title">
        <h2>Filter Semua Data</h2>
        <button class="btn-secondary no-print" onclick="clearFilter()">Reset Filter</button>
      </div>
      <input id="globalFilter" placeholder="Cari Material, Upah, BOP, jenis atau satuan..." oninput="renderDetail()">
    </div>

    <div id="sections"></div>
  </div>
</div>

<script>
const KEY='pcm_v3_data';
let db=JSON.parse(localStorage.getItem(KEY)||'{"projects":[]}');
let currentProjectId=null;

const types={
 Material:['Semen','Pasir','Batu','Besi','Kayu','Aluminium','Kaca','Cat','Electrical','Plumbing','Lainnya'],
 Upah:['Tukang','Kenek','Mandor','Operator','Harian','Borongan','Lainnya'],
 BOP:['Transport','Sewa Alat','Listrik','Air','Administrasi','Konsumsi','Pengiriman','Alat Kerja','Lainnya']
};

function saveDB(){localStorage.setItem(KEY,JSON.stringify(db))}
function rupiah(n){return 'Rp '+Number(n||0).toLocaleString('id-ID')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function current(){return db.projects.find(p=>p.id===currentProjectId)}

function addProject(){
 const p={id:uid(),name:'Proyek Baru',date:new Date().toISOString().slice(0,10),status:'Draft',photo:'',company:'',reportNo:'',client:'',location:'',preparedBy:'',approvedBy:'',material:[],upah:[],bop:[]};
 db.projects.unshift(p); saveDB(); openProject(p.id);
}
function deleteCurrentProject(){
 const p=current(); if(!p)return;
 if(confirm('Hapus proyek '+p.name+'?')){db.projects=db.projects.filter(x=>x.id!==p.id);saveDB();backDashboard()}
}
function saveProjectMeta(){
 const p=current(); if(!p)return;
 p.name=document.getElementById('pName').value.trim()||'Tanpa Nama';
 p.date=document.getElementById('pDate').value;
 p.status=document.getElementById('pStatus').value;
 p.company=document.getElementById('pCompany').value.trim();
 p.reportNo=document.getElementById('pReportNo').value.trim();
 p.client=document.getElementById('pClient').value.trim();
 p.location=document.getElementById('pLocation').value.trim();
 p.preparedBy=document.getElementById('pPreparedBy').value.trim();
 p.approvedBy=document.getElementById('pApprovedBy').value.trim();
 saveDB(); renderDashboard(); renderDetail(); alert('Data proyek berhasil disimpan.');
}
function backDashboard(){currentProjectId=null;document.getElementById('detail').classList.add('hidden');document.getElementById('dashboard').classList.remove('hidden');renderDashboard()}
function openProject(id){
 currentProjectId=id; const p=current(); if(!p)return;
 document.getElementById('dashboard').classList.add('hidden');document.getElementById('detail').classList.remove('hidden');
 document.getElementById('pName').value=p.name||'';
 document.getElementById('pDate').value=p.date||'';
 document.getElementById('pStatus').value=p.status||'Draft';
 document.getElementById('pCompany').value=p.company||'';
 document.getElementById('pReportNo').value=p.reportNo||'';
 document.getElementById('pClient').value=p.client||'';
 document.getElementById('pLocation').value=p.location||'';
 document.getElementById('pPreparedBy').value=p.preparedBy||'';
 document.getElementById('pApprovedBy').value=p.approvedBy||'';
 const img=document.getElementById('projectPhotoPreview');
 if(p.photo){img.src=p.photo;img.style.display='block'}else{img.style.display='none'}
 document.getElementById('globalFilter').value='';
 renderDetail();
}

function renderDashboard(){
 const q=(document.getElementById('projectSearch').value||'').toLowerCase();
 const st=document.getElementById('projectStatusFilter').value;
 const ps=db.projects.filter(p=>(!q||p.name.toLowerCase().includes(q))&&(!st||p.status===st));
 document.getElementById('statProjects').textContent=db.projects.length;
 document.getElementById('statRunning').textContent=db.projects.filter(p=>p.status==='Berjalan').length;
 document.getElementById('statDone').textContent=db.projects.filter(p=>p.status==='Selesai').length;
 document.getElementById('statHpp').textContent=rupiah(db.projects.reduce((a,p)=>a+totalProject(p),0));
 const box=document.getElementById('projectList');
 if(!ps.length){box.innerHTML='<div class="empty">Belum ada proyek. Klik + Tambah Proyek.</div>';return}
 box.innerHTML=ps.map(p=>{
   const cls=p.status==='Selesai'?'done':p.status==='Berjalan'?'running':'draft';
   return `<div class="project-card">
    <h3>${esc(p.name)}</h3>
    <div class="meta">Tanggal: ${esc(p.date||'-')}</div>
    <span class="badge ${cls}">${esc(p.status||'Draft')}</span>
    <div class="meta">HPP: <b>${rupiah(totalProject(p))}</b></div>
    <div class="toolbar no-print">
      <button class="btn-primary" onclick="openProject('${p.id}')">Buka</button>
      <button class="btn-danger" onclick="deleteProject('${p.id}')">Hapus</button>
    </div>
   </div>`;
 }).join('');
}
function deleteProject(id){
 const p=db.projects.find(x=>x.id===id); if(!p)return;
 if(confirm('Hapus proyek '+p.name+'?')){db.projects=db.projects.filter(x=>x.id!==id);saveDB();renderDashboard()}
}
function totalRows(arr){return arr.reduce((s,r)=>s+(Number(r.qty)||0)*(Number(r.price)||0),0)}
function totalProject(p){return totalRows(p.material)+totalRows(p.upah)+totalRows(p.bop)}

function previewProjectPhoto(e){
 const f=e.target.files[0]; if(!f)return;
 const reader=new FileReader();
 reader.onload=()=>compressImage(reader.result,900,0.75,data=>{
   current().photo=data;
   const img=document.getElementById('projectPhotoPreview');img.src=data;img.style.display='block';
   saveDB();
 });
 reader.readAsDataURL(f);
}
function compressImage(src,max,quality,cb){
 const img=new Image();
 img.onload=()=>{
  let w=img.width,h=img.height;
  if(w>max||h>max){const r=Math.min(max/w,max/h);w=Math.round(w*r);h=Math.round(h*r)}
  const c=document.createElement('canvas');c.width=w;c.height=h;
  c.getContext('2d').drawImage(img,0,0,w,h);
  cb(c.toDataURL('image/jpeg',quality));
 };
 img.src=src;
}

function clearFilter(){document.getElementById('globalFilter').value='';renderDetail()}
function renderDetail(){
 const p=current(); if(!p)return;
 ['material','upah','bop'].forEach(k=>(p[k]||[]).forEach(r=>{if(!r.date)r.date=p.date||new Date().toISOString().slice(0,10)}));
 saveDB();
 document.getElementById('sumMaterial').textContent=rupiah(totalRows(p.material));
 document.getElementById('sumUpah').textContent=rupiah(totalRows(p.upah));
 document.getElementById('sumBop').textContent=rupiah(totalRows(p.bop));
 document.getElementById('sumHpp').textContent=rupiah(totalProject(p));
 const q=(document.getElementById('globalFilter').value||'').toLowerCase();
 document.getElementById('sections').innerHTML=
  makeSection('Material','material',p.material,q)+
  makeSection('Upah','upah',p.upah,q)+
  makeSection('BOP','bop',p.bop,q);
}
function makeSection(title,key,arr,q){
 const filtered=arr.filter(r=>!q||[r.date,r.name,r.kind,r.unit].join(' ').toLowerCase().includes(q));
 let rows=filtered.map(r=>rowHTML(key,r)).join('');
 return `<div class="card">
   <div class="section-title">
    <h2>${title}</h2>
    <button class="btn-primary no-print" onclick="addRow('${key}')">+ Tambah ${title}</button>
   </div>
   <div class="table-wrap">
    <table>
     <thead><tr><th>Tanggal</th><th>Nama</th><th>Jenis</th><th>Qty</th><th>Satuan</th><th>Harga/Satuan</th><th>Total</th><th>Aksi</th></tr></thead>
     <tbody>${rows||'<tr><td colspan="8" class="empty">Belum ada data</td></tr>'}</tbody>
    </table>
   </div>
  </div>`;
}
function optionsFor(key,selected){
 return types[key==='material'?'Material':key==='upah'?'Upah':'BOP'].map(x=>`<option ${x===selected?'selected':''}>${x}</option>`).join('');
}
function rowHTML(key,r){
 return `<tr data-id="${r.id}">
  <td><input type="date" value="${esc(r.date||new Date().toISOString().slice(0,10))}" onchange="editField('${key}','${r.id}','date',this.value)"></td>
  <td><input value="${esc(r.name)}" onchange="editField('${key}','${r.id}','name',this.value)"></td>
  <td><select onchange="editField('${key}','${r.id}','kind',this.value)">${optionsFor(key,r.kind)}</select></td>
  <td><input type="number" min="0" step="any" value="${r.qty}" onchange="editField('${key}','${r.id}','qty',this.value)"></td>
  <td><input value="${esc(r.unit)}" onchange="editField('${key}','${r.id}','unit',this.value)"></td>
  <td><input type="number" min="0" step="any" value="${r.price}" onchange="editField('${key}','${r.id}','price',this.value)"></td>
  <td><b>${rupiah((Number(r.qty)||0)*(Number(r.price)||0))}</b></td>
  <td class="row-actions no-print">
   <button class="btn-success" onclick="saveRow('${key}','${r.id}')">Simpan</button>
   <button class="btn-secondary" onclick="cancelRow('${key}','${r.id}')">Batal</button>
   <button class="btn-danger" onclick="deleteRow('${key}','${r.id}')">Hapus</button>
  </td>
 </tr>`;
}
function editField(key,id,field,val){
 const r=current()[key].find(x=>x.id===id);if(!r)return;
 r.date=r.date||new Date().toISOString().slice(0,10);
 r._draft=r._draft||{date:r.date,name:r.name,kind:r.kind,qty:r.qty,unit:r.unit,price:r.price};
 r._draft[field]=(field==='qty'||field==='price')?Number(val):val;
}
function addRow(key){
 const p=current(); if(!p)return;
 const today=new Date().toISOString().slice(0,10);
 p[key].push({id:uid(),date:today,name:'',kind:types[key==='material'?'Material':key==='upah'?'Upah':'BOP'][0],qty:1,unit:'',price:0,_draft:{date:today,name:'',kind:types[key==='material'?'Material':key==='upah'?'Upah':'BOP'][0],qty:1,unit:'',price:0}});
 saveDB();renderDetail();
 setTimeout(()=>document.querySelector(`#sections table tbody tr[data-id="${p[key][p[key].length-1].id}"] input`)?.focus(),50);
}
function saveRow(key,id){
 const r=current()[key].find(x=>x.id===id);if(!r)return;
 if(r._draft)Object.assign(r,r._draft);
 delete r._draft;
 saveDB();renderDetail();renderDashboard();
}
function cancelRow(key,id){
 const arr=current()[key];const r=arr.find(x=>x.id===id);if(!r)return;
 if(!r.name&&!r.unit&&!r.price&&arr.length===1){arr.splice(arr.indexOf(r),1)}
 else if(r._draft){delete r._draft}
 saveDB();renderDetail();
}
function deleteRow(key,id){
 const arr=current()[key];if(confirm('Hapus data ini?')){current()[key]=arr.filter(r=>r.id!==id);saveDB();renderDetail();renderDashboard()}
}
function exportProjectCSV(){
 const p=current(); if(!p)return;
 let csv='Kategori,Tanggal,Nama,Jenis,Qty,Satuan,Harga Satuan,Total\\n';
 ['material','upah','bop'].forEach(key=>p[key].forEach(r=>{
  csv+=`"${key.toUpperCase()}","${csvEsc(r.date||'')}","${csvEsc(r.name)}","${csvEsc(r.kind)}",${r.qty},"${csvEsc(r.unit)}",${r.price},${(Number(r.qty)||0)*(Number(r.price)||0)}\\n`;
 }));
 csv+=`\\n"TOTAL HPP","","","","","",${totalProject(p)}\\n`;
 downloadFile(p.name.replace(/[^a-z0-9]/gi,'_')+'.csv','text/csv;charset=utf-8;',csv);
}
function csvEsc(s){return String(s??'').replace(/"/g,'""')}
function downloadFile(name,type,data){
 const blob=new Blob([data],{type});const a=document.createElement('a');
 a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function printProject(){
 const p=current(); if(!p)return;
 const labels={material:'MATERIAL',upah:'UPAH',bop:'BOP'};
 const q=(document.getElementById('globalFilter').value||'').trim().toLowerCase();
 const filtered={};
 ['material','upah','bop'].forEach(key=>{
   filtered[key]=(p[key]||[]).filter(r=>!q || [r.date,r.name,r.kind,r.unit].join(' ').toLowerCase().includes(q));
 });
 const total=key=>totalRows(filtered[key]);
 const grand=total('material')+total('upah')+total('bop');
 const reportNo=p.reportNo||('PCM-'+String(p.id).slice(-6).toUpperCase());

 let out=`<div class="pr-header">
   <div>
     <div class="pr-brand">${esc(p.company||'PROJECT COST MANAGER')}</div>
     <div class="pr-sub">${esc(p.location||'Laporan biaya proyek')}</div>
   </div>
   <div class="pr-report-no">NO. LAPORAN<br><b>${esc(reportNo)}</b></div>
 </div>
 <div class="pr-title">LAPORAN REKAPITULASI BIAYA PROYEK</div>
 ${q?`<div class="pr-filter">Laporan ini dicetak berdasarkan filter: <b>${esc(document.getElementById('globalFilter').value)}</b></div>`:''}
 <div class="pr-info">
   <div class="pr-info-row"><span class="pr-info-label">Proyek</span><span class="pr-info-value">${esc(p.name||'-')}</span></div>
   <div class="pr-info-row"><span class="pr-info-label">Tanggal</span><span class="pr-info-value">${esc(p.date||'-')}</span></div>
   <div class="pr-info-row"><span class="pr-info-label">Klien</span><span class="pr-info-value">${esc(p.client||'-')}</span></div>
   <div class="pr-info-row"><span class="pr-info-label">Status</span><span class="pr-info-value">${esc(p.status||'Draft')}</span></div>
 </div>
 <div class="pr-summary">
   <div class="pr-summary-box"><div class="pr-summary-label">Material</div><div class="pr-summary-value">${rupiah(total('material'))}</div></div>
   <div class="pr-summary-box"><div class="pr-summary-label">Upah</div><div class="pr-summary-value">${rupiah(total('upah'))}</div></div>
   <div class="pr-summary-box"><div class="pr-summary-label">BOP</div><div class="pr-summary-value">${rupiah(total('bop'))}</div></div>
   <div class="pr-summary-box"><div class="pr-summary-label">Total HPP</div><div class="pr-summary-value">${rupiah(grand)}</div></div>
 </div>`;

 ['material','upah','bop'].forEach(key=>{
   const arr=filtered[key];
   out+=`<div class="pr-section"><div class="pr-section-title">${labels[key]}</div>
     <div class="pr-line pr-line-head"><span>Tanggal</span><span>Uraian / Jenis</span><span class="pr-right">Qty</span><span class="pr-right">Satuan</span><span class="pr-right">Jumlah</span></div>`;
   if(!arr.length){
     out+=`<div class="pr-line"><span>-</span><span>Tidak ada data${q?' yang sesuai filter':''}.</span><span></span><span></span><span class="pr-right">Rp 0</span></div>`;
   }else{
     arr.forEach(r=>{
       const t=(Number(r.qty)||0)*(Number(r.price)||0);
       out+=`<div class="pr-line">
         <span>${esc(r.date||'-')}</span>
         <span>${esc(r.name||'Tanpa nama')} <span style="color:#666">(${esc(r.kind||'-')})</span></span>
         <span class="pr-right">${esc(r.qty)}</span>
         <span class="pr-right">${esc(r.unit||'-')}</span>
         <span class="pr-right">${rupiah(t)}</span>
       </div>`;
     });
   }
   out+=`<div class="pr-subtotal">TOTAL ${labels[key]}: &nbsp; ${rupiah(total(key))}</div></div>`;
 });

 out+=`<div class="pr-grand"><span>TOTAL HPP${q?' (TERFILTER)':''}</span><span>${rupiah(grand)}</span></div>
 <div class="pr-note">Catatan: laporan ini merupakan rekap biaya berdasarkan data yang tersimpan pada Project Cost Manager. Nilai total mengikuti filter yang aktif saat laporan dicetak.</div>
 <div class="pr-sign">
   <div class="pr-sign-box">Dibuat Oleh<div class="pr-sign-space"></div><b>${esc(p.preparedBy||'________________')}</b></div>
   <div class="pr-sign-box">Disetujui Oleh<div class="pr-sign-space"></div><b>${esc(p.approvedBy||'________________')}</b></div>
 </div>
 <div class="pr-footer">Project Cost Manager • ${esc(p.name||'Proyek')}</div>`;

 document.getElementById('printReport').innerHTML=out;
 window.print();
 setTimeout(()=>{document.getElementById('printReport').innerHTML=''},500);
}

renderDashboard();
</script>
</body>
</html>
